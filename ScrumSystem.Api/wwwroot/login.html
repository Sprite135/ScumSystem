<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Scrum System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="login-screen">
        <div class="login-bg-dark">
            <div class="glow glow-1"></div>
            <div class="glow glow-2"></div>
        </div>
        
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
        
        <div class="login-container-dark">
            <div class="login-card-dark">
            <div class="login-brand">
                <div class="brand-icon">
                    <i class="fas fa-users-cog"></i>
                </div>
                <h2>Bienvenido de vuelta</h2>
                <p>Inicia sesión para continuar</p>
            </div>
            
            <form id="login-form" class="login-form-dark">
                <div class="input-dark">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" required placeholder="Correo electrónico">
                </div>
                <div class="input-dark">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" required placeholder="Contraseña">
                    <button type="button" class="toggle-pwd" onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggle-icon"></i>
                    </button>
                </div>
                
                <div class="login-options">
                    <label class="checkbox-dark">
                        <input type="checkbox" id="remember-me">
                        <span class="check-dark"><i class="fas fa-check"></i></span>
                        Recordarme
                    </label>
                    <a href="#" class="link-dark">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn-login-dark">
                    <span>Iniciar Sesión</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            
            <div class="login-divider">
                <span>o continúa con</span>
            </div>
            
            <!-- Google Sign In Button -->
            <div class="google-signin-wrapper">
                <button class="btn-google-custom" id="google-signin-btn" type="button">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Continuar con Google</span>
                </button>
            </div>
            <div id="g_id_signin" style="display: none;"></div>
            
            <div class="demo-buttons">
                <button class="btn-demo" onclick="fillDemo('admin@scrum.com')">
                    <i class="fas fa-user-shield"></i>
                    <span>Admin Demo</span>
                </button>
                <button class="btn-demo" onclick="fillDemo('scrum@scrum.com')">
                    <i class="fas fa-user-tie"></i>
                    <span>Scrum Master</span>
                </button>
            </div>
            
            <div class="register-link">
                <p>¿No tienes cuenta? <a href="register.html" class="link-dark">Regístrate gratis</a></p>
            </div>
        </div>
    </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <span id="toast-message"></span>
    </div>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // Google Sign In with OAuth popup
        window.onload = function() {
            // Trigger Google sign-in when custom button is clicked
            document.getElementById('google-signin-btn').addEventListener('click', function() {
                // Open Google OAuth popup
                const width = 500;
                const height = 600;
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;
                
                const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?` +
                    `client_id=468703073359-gm6s5nljholv5i1u824g3mi6nnmp2skl.apps.googleusercontent.com&` +
                    `redirect_uri=${encodeURIComponent(window.location.origin + '/google-callback.html')}&` +
                    `response_type=id_token&` +
                    `scope=openid%20email%20profile&` +
                    `nonce=${Math.random().toString(36).substring(2)}`;
                
                const popup = window.open(
                    googleAuthUrl,
                    'google-signin',
                    `width=${width},height=${height},top=${top},left=${left}`
                );
                
                // Listen for message from popup
                window.addEventListener('message', function handleMessage(e) {
                    if (e.origin !== window.location.origin) return;
                    if (e.data.type === 'google-signin') {
                        window.removeEventListener('message', handleMessage);
                        handleGoogleSignIn({ credential: e.data.credential });
                    }
                });
            });
        };

        async function handleGoogleSignIn(response) {
            try {
                // Send Google token to backend
                const result = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                
                if (!result.ok) {
                    const error = await result.text();
                    throw new Error(error);
                }
                
                const user = await result.json();
                localStorage.setItem('scrumUser', JSON.stringify(user));
                showToast('Bienvenido ' + user.name);
                window.location.href = 'app.html';
            } catch (error) {
                console.error('Google sign in error:', error);
                showToast('Error al iniciar sesión con Google', 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toastMessage.textContent = message;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>

    <script src="js/auth.js"></script>
</body>
</html>
