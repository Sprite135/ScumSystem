<!-- Team Management Page -->
<div id="page-team-management" class="page">
    <div class="page-header">
        <div class="page-header-left">
            <div class="page-icon">
                <i class="fas fa-users"></i>
            </div>
            <div>
                <h1>Gestión del Equipo</h1>
                <p>Administra los miembros de todos los proyectos</p>
            </div>
        </div>
    </div>

    <div class="team-management-content">
        <div class="team-stats">
            <div class="stat-card">
                <i class="fas fa-users"></i>
                <div class="stat-info">
                    <div class="stat-number" id="total-members">0</div>
                    <div class="stat-label">Total Miembros</div>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-project-diagram"></i>
                <div class="stat-info">
                    <div class="stat-number" id="total-projects">0</div>
                    <div class="stat-label">Proyectos</div>
                </div>
            </div>
        </div>

        <div class="team-sections">
            <!-- Projects with their members -->
            <div class="projects-members" id="projects-members">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>
</div>
