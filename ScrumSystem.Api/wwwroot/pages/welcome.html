<!-- Welcome Page -->
<div id="page-welcome" class="page active">

                            </div>
                        </button>
                        
                        <button class="action-card" onclick="showCreateQuickStory()">

                                <i class="fas fa-bolt"></i>
                            </div>
                            <div class="action-content">
                                <h4>Historia Rápida</h4>
                                <p>Agrega una historia al instante</p>
                            </div>
                        </button>
                    </div>
                </div>
                
                <div class="recent-projects" id="recent-projects">
                    <h3>Proyectos Recientes</h3>
                    <div class="projects-grid" id="recent-projects-grid">

                    </div>

            </div>
